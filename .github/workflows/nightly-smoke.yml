name: TraVerse Nightly AI Smoke

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # GitHub does not expose the secrets context in a job-level `if`.
    # The repository variable gates whether this workflow is enabled;
    # the first step validates that the provider secret is actually present.
    if: ${{ vars.ENABLE_AI_SMOKE_TEST == 'true' }}
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: nightly-smoke-secret
      DJANGO_DEBUG: "True"
      DJANGO_ENV: development
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: traverse_smoke
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL_NAME: ${{ vars.GROQ_MODEL_NAME || 'llama-3.1-8b-instant' }}
      GROQ_TIMEOUT_SECONDS: "30"
      GROQ_MAX_RETRIES: "3"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: traverse_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d traverse_smoke"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Validate smoke-test gate
        shell: bash
        run: |
          if [[ -z "${GROQ_API_KEY}" ]]; then
            echo "ENABLE_AI_SMOKE_TEST is true but GROQ_API_KEY is not configured."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/development.txt

      - name: Apply migrations
        working-directory: backend
        run: python manage.py migrate --noinput

      - name: Run real-provider smoke test
        working-directory: backend
        run: python -m ai.tests.test_chapter28_smoke
