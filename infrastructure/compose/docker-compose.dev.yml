services:
  django:
    command: >
      python manage.py runserver 0.0.0.0:8000

    # Publish Django only for local frontend development.
    # Production continues to reach Django through Nginx internally.
    ports:
      - "8000:8000"

    volumes:
      - ../../backend:/app

  nginx:
    depends_on:
      django:
        condition: service_healthy
